# Include at http level, for example through /etc/nginx/sites-enabled/.
limit_req_zone $binary_remote_addr zone=af_chat_ip:5m rate=30r/m;
limit_req_zone $server_name zone=af_chat_total:1m rate=90r/m;
limit_req_zone $binary_remote_addr zone=af_manager_login:5m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=af_chat_conn_ip:5m;
limit_conn_zone $server_name zone=af_chat_conn_total:1m;

server {
    listen 80;
    server_name support.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai-forge-acme;
    }

    location / {
        return 308 https://support.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name support.example.com;

    ssl_certificate /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @busy;

    location = /api/chat {
        limit_req zone=af_chat_ip burst=8 nodelay;
        limit_req zone=af_chat_total burst=20 nodelay;
        limit_conn af_chat_conn_ip 4;
        limit_conn af_chat_conn_total 12;
        proxy_buffering off;
        gzip off;
        proxy_pass http://127.0.0.1:3013;
    }

    location = /api/manager/session {
        limit_req zone=af_manager_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:3013;
    }

    location / {
        proxy_pass http://127.0.0.1:3013;
    }

    location @busy {
        default_type text/plain;
        charset utf-8;
        add_header Retry-After 10 always;
        return 429 "Слишком много запросов. Попробуйте ещё раз через несколько секунд.";
    }
}
